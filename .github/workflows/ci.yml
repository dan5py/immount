name: CI

# Every pull request runs this workflow, so the jobs can be required checks on main. A job whose
# files didn't change is skipped, and a skipped job counts as passed. A release commit only
# changes the version and the changelog, so it skips both.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # paths-filter lists the files of a pull request through the API.
  pull-requests: read

# A new push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.filter.outputs.website }}
      kit: ${{ steps.filter.outputs.kit }}
    steps:
      # On push, paths-filter compares commits with git.
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            website:
              - apps/website/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .github/workflows/ci.yml
            kit:
              - apps/macos/ImmountKit/**
              - .github/workflows/ci.yml

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from packageManager in package.json. Pinned because the v6 tag
      # still points to v6.0.10, which predates pnpm 12 support.
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  kit:
    needs: changes
    if: needs.changes.outputs.kit == 'true'
    # The app and the extension need a signing team, so the package tests are the gate.
    runs-on: xcode-27
    defaults:
      run:
        working-directory: apps/macos/ImmountKit
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -version && swift --version
      - run: swift test
