name: CI

# A release commit only changes the version and the changelog, which neither job reads. A push
# that also touches other files still runs.
on:
  push:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md
      - apps/macos/Config/Version.xcconfig
      - README.md
  pull_request:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md
      - apps/macos/Config/Version.xcconfig
      - README.md

permissions:
  contents: read

# A new push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The package tests are in kit.yml, so they can skip website-only changes.
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from packageManager in package.json. Pinned because the v6 tag
      # still points to v6.0.10, which predates pnpm 12 support.
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
