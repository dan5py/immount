name: PR title

# Pull requests are squash merged with their title as the commit message, and git-cliff builds
# the version and the changelog from those messages, so the title must be a Conventional Commit.
# pull_request_target lets this run for forks too; it never checks out their code.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The changelog starts each entry with the subject, capitalized.
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: |
            Start the description "{subject}" with a lowercase letter and don't end it with a period,
            e.g. "fix: keep the dock icon hidden after reopening the app".
